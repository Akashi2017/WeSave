<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>公众号文章下载</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#07c160,#06ad56);padding:20px 16px 28px;color:#fff;text-align:center}
.header h1{font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.header p{font-size:13px;opacity:.8}
.container{flex:1;padding:16px;max-width:640px;margin:0 auto;width:100%}
.input-card{background:#fff;border-radius:12px;padding:16px;margin-top:-16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.input-card label{display:block;font-size:13px;font-weight:500;color:#666;margin-bottom:6px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;background:#fafafa}
.input-row input:focus{border-color:#07c160;background:#fff}
.input-row button{padding:10px 20px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .2s}
.input-row button:hover{background:#06ad56}
.input-row button:disabled{background:#ccc;cursor:not-allowed}
.hint{font-size:12px;color:#999;margin-top:8px;line-height:1.5}
.hint code{background:#f0f0f0;padding:1px 6px;border-radius:3px;font-size:11px}

/* Status */
.status{padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13px;display:none}
.status.loading{display:block;background:#e8f5e9;color:#2e7d32}
.status.error{display:block;background:#ffebee;color:#c62828}
.status.success{display:block;background:#e8f5e9;color:#2e7d32}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #a5d6a7;border-top-color:#2e7d32;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Result */
.result{display:none}
.result.show{display:block}
.article-meta{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.article-meta h2{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:8px}
.article-meta .meta-row{font-size:12px;color:#999;margin-bottom:2px;line-height:1.6}
.article-meta .cover{margin-top:8px}
.article-meta .cover img{width:100%;border-radius:8px;max-height:200px;object-fit:cover}

/* Preview */
.preview-card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.preview-header{padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.preview-header span{font-size:13px;font-weight:500;color:#333}
.preview-body{padding:16px;max-height:400px;overflow-y:auto;font-size:14px;line-height:1.8;color:#333}
.preview-body img{max-width:100%;border-radius:6px;margin:8px 0}
.preview-body p{margin:8px 0}
.preview-body h1,.preview-body h2{font-size:16px;margin:12px 0 6px}
.preview-body blockquote{border-left:3px solid #ddd;margin:8px 0;padding:6px 12px;color:#666;background:#f9f9f9;border-radius:0 4px 4px 0}
.preview-body code{background:#f0f0f0;padding:1px 5px;border-radius:3px;font-size:13px}
.preview-body pre{background:#f5f5f5;padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0}

/* Actions */
.actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-download-md{background:#07c160;color:#fff}
.btn-download-md:hover{background:#06ad56}
.btn-download-html{background:#1a73e8;color:#fff}
.btn-download-html:hover{background:#1557b0}
.btn-copy{background:#f5f5f5;color:#333;border:1.5px solid #e0e0e0!important}
.btn-copy:hover{background:#eee}
.count{font-size:12px;color:#999;text-align:center;padding:8px;margin-bottom:20px}

/* Steps */
.steps{display:flex;gap:8px;margin-bottom:16px;justify-content:center}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:#999}
.step-num{width:20px;height:20px;border-radius:50%;background:#e0e0e0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step.active .step-num{background:#07c160}
.step.active{color:#07c160}
.step-line{width:20px;height:1px;background:#e0e0e0}
.step.active+.step-line{background:#07c160}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;transition:opacity .3s}
.toast.show{display:block}
.toast.success{background:#07c160}
.toast.error{background:#e53935}

.footer{text-align:center;padding:16px;font-size:12px;color:#ccc}
</style>
</head>
<body>
<div class="header">
  <h1>公众号文章下载</h1>
  <p>粘贴文章链接即可保存为 Markdown / HTML</p>
</div>
<div class="container">
  <div class="input-card">
    <label>文章链接</label>
    <div class="input-row">
      <input id="urlInput" placeholder="https://mp.weixin.qq.com/s/..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="fetchBtn" onclick="fetchArticle()">解析下载</button>
    </div>
    <div class="hint" id="modeHint">
      在微信中打开文章 → 右上角 <code>...</code> → 复制链接 → 粘贴到上方
    </div>
    <div style="margin-top:8px;text-align:right">
      <span style="font-size:12px;color:#999;cursor:pointer" onclick="toggleMode()" id="modeToggle">解析失败？试试粘贴 HTML 源码</span>
    </div>
  </div>

  <!-- Manual HTML paste (hidden by default) -->
  <div class="input-card" id="manualCard" style="display:none;margin-top:12px">
    <label>或直接粘贴文章 HTML 源码</label>
    <textarea id="htmlInput" rows="6" style="width:100%;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;resize:vertical;font-family:monospace;margin-bottom:8px;background:#fafafa" placeholder="在浏览器中打开文章 → 右键"查看网页源代码" → 全选复制 → 粘贴到此处"></textarea>
    <button class="btn-secondary" onclick="parseHtml()">从 HTML 解析</button>
  </div>

  <div class="steps">
    <div class="step active" id="step1"><span class="step-num">1</span> 复制链接</div><div class="step-line"></div>
    <div class="step" id="step2"><span class="step-num">2</span> 解析内容</div><div class="step-line"></div>
    <div class="step" id="step3"><span class="step-num">3</span> 下载保存</div>
  </div>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="article-meta" id="articleMeta"></div>

    <div class="actions" id="actionsArea">
      <button class="btn-download-md" onclick="downloadMarkdown()">下载 Markdown</button>
      <button class="btn-download-html" onclick="downloadHtml()">下载 HTML</button>
      <button class="btn-copy" onclick="copyMarkdown()">复制内容</button>
    </div>

    <div class="count" id="wordCount"></div>

    <div class="preview-card">
      <div class="preview-header"><span>内容预览</span><span style="font-size:11px;color:#999" id="previewToggle" onclick="togglePreview()">收起</span></div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <div class="footer">又湘游 · 文旅湖南</div>
</div>

<div class="toast" id="toast"></div>

<script>
let cachedData = null;

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(msg, type) {
  const s = document.getElementById('status');
  s.className = 'status ' + type;
  s.innerHTML = msg;
  s.style.display = 'block';
}

function hideStatus() {
  document.getElementById('status').style.display = 'none';
}

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i);
    el.className = 'step' + (i <= n ? ' active' : '');
  }
}

async function fetchArticle() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showToast('请输入文章链接', 'error'); return; }
  if (!url.includes('mp.weixin.qq.com')) { showToast('请输入有效的公众号文章链接', 'error'); return; }

  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  btn.textContent = '解析中...';
  setStatus('<span class="spinner"></span> 正在获取文章内容...', 'loading');
  document.getElementById('result').classList.remove('show');
  setStep(2);

  try {
    const res = await fetch('/api/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (!data.success) {
      setStatus(data.error || '解析失败', 'error');
      btn.disabled = false;
      btn.textContent = '解析下载';
      return;
    }

    cachedData = data.data;
    hideStatus();
    renderResult(data.data);
    setStep(3);
    btn.disabled = false;
    btn.textContent = '解析下载';
    showToast('解析成功', 'success');
  } catch (e) {
    setStatus('网络错误: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '解析下载';
  }
}

function renderResult(d) {
  // Meta
  document.getElementById('articleMeta').innerHTML = `
    <h2>${d.title}</h2>
    <div class="meta-row">${d.account}${d.author ? ' · ' + d.author : ''}</div>
    <div class="meta-row">${d.publishTime}</div>
    ${d.coverUrl ? '<div class="cover"><img src="' + d.coverUrl + '" alt="封面" onerror="this.style.display=\'none\'"></div>' : ''}
  `;

  // Preview
  document.getElementById('previewBody').innerHTML = d.content || '(无正文内容)';
  document.getElementById('previewToggle').textContent = '收起';

  // Word count
  document.getElementById('wordCount').textContent = '全文约 ' + d.wordCount + ' 字';

  document.getElementById('result').classList.add('show');
}

function toggleMode() {
  const manual = document.getElementById('manualCard');
  const toggle = document.getElementById('modeToggle');
  if (manual.style.display === 'none') {
    manual.style.display = 'block';
    toggle.textContent = '使用链接抓取';
    document.getElementById('modeHint').style.display = 'none';
  } else {
    manual.style.display = 'none';
    toggle.textContent = '解析失败？试试粘贴 HTML 源码';
    document.getElementById('modeHint').style.display = 'block';
  }
}

function parseHtml() {
  const html = document.getElementById('htmlInput').value.trim();
  if (!html || html.length < 100) { showToast('请粘贴完整的文章 HTML 源码', 'error'); return; }

  setStatus('正在解析 HTML...', 'loading');
  document.getElementById('result').classList.remove('show');

  // Extract title
  let title = '';
  const titleMatch = html.match(/msg_title\s*=\s*"([^"]+)"/) || html.match(/<title>([^<]+)<\/title>/);
  if (titleMatch) title = titleMatch[1];

  // Extract account
  let account = '';
  const accMatch = html.match(/nick_name\s*=\s*"([^"]+)"/) || html.match(/nickname\s*=\s*"([^"]+)"/);
  if (accMatch) account = accMatch[1];

  // Extract content
  let body = '';
  const jsStart = html.indexOf('id="js_content"');
  if (jsStart > -1) {
    const tagEnd = html.indexOf('>', jsStart);
    if (tagEnd > -1) {
      const rest = html.slice(tagEnd + 1);
      const endMarkers = ['id="js_pcock_"', 'id="js_spc_"', 'class="rich_media_area_extra"'];
      let endPos = rest.length;
      for (const m of endMarkers) { const p = rest.indexOf(m); if (p > 0 && p < endPos) endPos = p; }
      body = rest.slice(0, endPos).replace(/data-src=/g, 'src=').replace(/data-croporisrc=/g, 'src=');
    }
  }

  if (!title && !body) {
    setStatus('无法从 HTML 中解析出文章内容，请确认粘贴的是完整的网页源码', 'error');
    return;
  }

  hideStatus();
  cachedData = {
    title: title || '(无标题)',
    account: account || '',
    content: body || '',
    markdown: '',
    html: '',
    wordCount: (body || '').replace(/<[^>]+>/g, '').length,
    sourceUrl: '',
    publishTime: '',
    author: '',
    coverUrl: '',
  };

  // Generate markdown via backend (use same endpoint but with html flag)
  // For now, do simple client-side conversion
  let md = `# ${title || '无标题'}\n\n`;
  let text = body
    .replace(/<h[1-4][^>]*>([\s\S]*?)<\/h[1-4]>/gi, (m, c) => `\n## ${c.replace(/<[^>]+>/g, '')}\n`)
    .replace(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi, (m, s) => `\n![图片](${s})\n`)
    .replace(/<(strong|b)[^>]*>([\s\S]*?)<\/(strong|b)>/gi, (m, t1, c) => `**${c.replace(/<[^>]+>/g, '')}**`)
    .replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, (m, c) => `${c.replace(/<[^>]+>/g, '')}\n\n`)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/\n{3,}/g, '\n\n').trim();
  cachedData.markdown = md + '\n' + text;

  const styledHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>body{font-family:-apple-system,sans-serif;max-width:680px;margin:0 auto;padding:16px;line-height:1.7;color:#333}img{max-width:100%;height:auto;border-radius:4px}</style></head><body><h1>${title}</h1>${body}</body></html>`;
  cachedData.html = styledHtml;

  renderResult(cachedData);
  setStep(3);
  showToast('解析成功', 'success');
}

function togglePreview() {
  const body = document.getElementById('previewBody');
  const toggle = document.getElementById('previewToggle');
  if (body.style.maxHeight === '400px' || !body.style.maxHeight) {
    body.style.maxHeight = 'none';
    toggle.textContent = '收起';
  } else {
    body.style.maxHeight = '400px';
    toggle.textContent = '展开';
  }
}

function downloadMarkdown() {
  if (!cachedData) return;
  const blob = new Blob([cachedData.markdown], { type: 'text/markdown;charset=utf-8' });
  downloadBlob(blob, (cachedData.title || 'article') + '.md');
  showToast('Markdown 已下载', 'success');
}

function downloadHtml() {
  if (!cachedData) return;
  const blob = new Blob([cachedData.html], { type: 'text/html;charset=utf-8' });
  downloadBlob(blob, (cachedData.title || 'article') + '.html');
  showToast('HTML 已下载', 'success');
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

async function copyMarkdown() {
  if (!cachedData) return;
  try {
    await navigator.clipboard.writeText(cachedData.markdown);
    showToast('已复制到剪贴板', 'success');
  } catch {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = cachedData.markdown;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板', 'success');
  }
}
</script>
</body>
</html>
